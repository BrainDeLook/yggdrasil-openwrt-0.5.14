name: Build OpenWrt packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: rockchip-armv8
            target_name: rockchip
            subtarget: armv8
          - target: armsr-armv8
            target_name: armsr
            subtarget: armv8

    steps:
      - name: Checkout package feed
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync unzip zlib1g-dev \
            file wget git xz-utils

      - name: Checkout OpenWrt
        run: git clone --depth=1 https://github.com/openwrt/openwrt.git openwrt

      - name: Configure feeds and target
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/yggdrasil-local net-local
          cp -a ../net/yggdrasil package/yggdrasil-local/
          mkdir -p feeds/luci/protocols/luci-proto-yggdrasil
          cp -a ../protocols/luci-proto-yggdrasil/. feeds/luci/protocols/luci-proto-yggdrasil/
          cat > .config <<EOF
          CONFIG_TARGET_${{ matrix.target_name }}=y
          CONFIG_TARGET_${{ matrix.target_name }}_${{ matrix.subtarget }}=y
          CONFIG_PACKAGE_yggdrasil=m
          CONFIG_PACKAGE_luci-proto-yggdrasil=m
          EOF
          make defconfig

      - name: Build packages
        working-directory: openwrt
        run: make package/yggdrasil/compile package/luci-proto-yggdrasil/compile V=s -j$(nproc)

      - name: Collect packages
        run: |
          mkdir -p artifacts/${{ matrix.target }}
          find openwrt/bin/packages -type f \( -name 'yggdrasil_*.ipk' -o -name 'luci-proto-yggdrasil_*.ipk' \) -exec cp {} artifacts/${{ matrix.target }}/ \;
          test -n "$(find artifacts/${{ matrix.target }} -type f -name '*.ipk' -print -quit)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: yggdrasil-0.5.14-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/*.ipk
